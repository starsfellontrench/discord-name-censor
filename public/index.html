<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>censor</title>
<meta name="description" content="hide your name in discord screenshots">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#e56aa5">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" defer></script>
<style>
:root{
  color-scheme:light;
  --ui:Tahoma,"Segoe UI",Verdana,Geneva,sans-serif;
  --title-font:"Trebuchet MS",Tahoma,sans-serif;
  --text:#1b1b1b;--dim:#5d5870;--link:#0b56d0;--link-hover:#d1418a;
  --pink:#e56aa5;--pink-dark:#d1418a;--lilac:#9a7fe0;--sel:#316ac5;
  --line:#d6cfe6;--face:#f6f3fb;--window:#ffffff;--btn-line:#8e86a8;
  --pane-head:#7b3a7f;--soft:#fde6f1;--soft-line:#f3b6d3;
  --stage:#313338;--stage-text:#dbdee1;--stage-dim:#949ba4;
  --balloon:#ffffe1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:12px/1.5 var(--ui);color:var(--text);background:#bcd3f2 linear-gradient(180deg,#8fb5ea 0%,#bcd3f2 55%,#d9e6f8 100%);padding:14px}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover);text-decoration:underline}
:focus-visible{outline:1px dotted #000;outline-offset:2px}

button,.btn{font:12px var(--ui);color:var(--text);padding:3px 11px;min-height:24px;border:1px solid var(--btn-line);border-radius:3px;cursor:pointer;white-space:nowrap;
  background:linear-gradient(180deg,#fff 0%,#f4f1f9 55%,#e3dcef 100%)}
button:hover:not(:disabled){border-color:var(--pink-dark);box-shadow:inset 0 0 0 1px var(--soft-line)}
button:active:not(:disabled){background:linear-gradient(180deg,#e3dcef,#f6f3fb)}
button:disabled{color:#a39fb0;border-color:#c9c4d6;cursor:default;background:var(--face)}
button.primary{color:#fff;border-color:#b3477f;font-weight:bold;text-shadow:0 1px 0 rgba(0,0,0,.25);
  background:linear-gradient(180deg,#f6a8cf 0%,#e56aa5 50%,#d1418a 100%)}
button.primary:disabled{color:#fff;opacity:.55}
button.primary:hover:not(:disabled){box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
kbd{font:11px var(--ui);border:1px solid var(--btn-line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:#fff;color:var(--text)}

.window{height:100%;display:flex;flex-direction:column;background:var(--window);border:1px solid #a768ad;border-radius:8px 8px 3px 3px;overflow:hidden;
  box-shadow:0 8px 28px rgba(40,30,90,.35)}
.titlebar{flex:none;display:flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 9px;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,.08) 48%,rgba(0,0,0,0) 52%),linear-gradient(90deg,#e56aa5 0%,#c779c9 55%,#9a7fe0 100%)}
.titlebar h1{margin:0;font:bold 13px var(--title-font);text-shadow:1px 1px 0 rgba(80,20,70,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebar h1 span{font-weight:normal;opacity:.9}
.titlebar .by{margin-left:auto;flex:none;color:#fff;font-size:11px;padding:2px 9px;border:1px solid rgba(255,255,255,.7);border-radius:3px;background:rgba(255,255,255,.16)}
.titlebar .by:hover{background:rgba(255,255,255,.3);color:#fff;text-decoration:none}

.commands{flex:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 8px;background:var(--face);border-bottom:1px solid var(--line)}
.commands .sep{width:1px;align-self:stretch;margin:2px 4px;background:var(--line)}
.commands .spacer{flex:1}
.seg{display:flex}
.seg button{border-radius:0}
.seg button:first-child{border-radius:3px 0 0 3px}
.seg button:last-child{border-radius:0 3px 3px 0;margin-left:-1px}
.seg button.on{background:linear-gradient(180deg,#e3dcef,#f6f3fb);box-shadow:inset 0 1px 3px rgba(60,40,90,.3);font-weight:bold}
#zoomPct{width:40px;text-align:center;color:var(--dim)}

main{flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr}
.tasks{order:-1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,#f7dbec 0%,#e2cdf2 60%,#cfbdf0 100%)}
.pane{background:#fff;border-radius:4px 4px 2px 2px;box-shadow:0 1px 2px rgba(80,40,110,.18)}
.pane>h2{margin:0;padding:5px 10px;font:bold 12px var(--title-font);color:var(--pane-head);border-radius:4px 4px 0 0;
  background:linear-gradient(90deg,#fff 0%,#fbeaf4 60%,#f0d7ea 100%)}
.pane .body{padding:8px 10px 10px;background:#fdf6fa;border-top:1px solid #fff;border-radius:0 0 2px 2px}
.hint{color:var(--dim);margin:0}
.hint b{color:var(--text)}
.pane ol{margin:0;padding-left:16px}
.pane li{margin:3px 0}
.pane li::marker{color:var(--pink-dark)}

#samples{display:flex;flex-direction:column;gap:6px}
.sample{background:#fff;border:1px solid var(--line);border-radius:3px;padding:6px 7px}
.sample .top{display:flex;align-items:center;gap:6px}
.sample .thumb{flex:none;width:40px;height:26px;border-radius:2px;border:2px solid;display:grid;place-items:center;overflow:hidden;background:var(--stage)}
.sample .thumb img{max-width:100%;max-height:100%;image-rendering:pixelated}
.sample input[type=text]{flex:1;min-width:0;font:bold 12px var(--ui);background:transparent;color:var(--text);border:1px solid transparent;border-radius:2px;padding:1px 3px}
.sample input[type=text]:hover,.sample input[type=text]:focus{border-color:var(--btn-line);background:#fff;outline:none}
.sample .count{color:var(--dim);font-size:11px;white-space:nowrap}
.x{min-height:0;padding:0 6px;line-height:16px;font-size:12px}
.x:hover:not(:disabled){color:#fff;border-color:#b3302f;background:linear-gradient(180deg,#e9826b,#c7402a)}
.sample .thr{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;color:var(--dim)}
.sample .thr span{width:30px;text-align:right}
.empty-list{color:var(--dim)}

.row{display:flex;align-items:center;gap:8px;margin:0 0 7px}
.row label{flex:1}
select{font:12px var(--ui);color:var(--text);background:#fff;border:1px solid #7f9db9;border-radius:0;padding:2px}
input[type=color]{width:30px;height:22px;padding:1px;border:1px solid #7f9db9;background:#fff}
input[type=range]{width:100%;accent-color:var(--pink-dark)}
input[type=checkbox]{accent-color:var(--pink-dark);width:13px;height:13px;margin:0}
.check{display:flex;gap:7px;align-items:flex-start;cursor:pointer}
.check input{margin-top:2px}

#right{display:flex;flex-direction:column;min-width:0;min-height:0}
#stageBox{position:relative;flex:1;min-height:0;display:flex}
#stage{position:relative;flex:1;min-width:0;min-height:0;overflow:auto;background:var(--stage);display:flex}
#drop{margin:auto;padding:36px 32px;max-width:420px;text-align:center;color:var(--stage-dim);border:2px dashed #5c5f66;border-radius:6px}
#drop strong{display:block;color:var(--stage-text);font:bold 16px var(--title-font);margin-bottom:6px}
#drop button{margin-top:16px;padding:5px 16px}
#wrap{position:relative;margin:auto;display:none;line-height:0;padding:16px 0}
#wrap canvas{display:block;width:100%}
#overlay{position:absolute;left:0;top:16px;height:calc(100% - 32px);cursor:crosshair;touch-action:none}
.balloon{background:var(--balloon);color:#000;border:1px solid #000;border-radius:7px;padding:6px 11px;box-shadow:2px 3px 6px rgba(0,0,0,.35);font:12px var(--ui)}
#banner{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:none;z-index:2;max-width:calc(100% - 32px);padding-right:6px}
#banner .in{display:flex;align-items:center;gap:10px}
#banner button.x{flex:none;min-height:18px;background:#fff}
body.dragging #stage::after{content:"drop to add";position:absolute;inset:8px;border:2px dashed var(--pink);border-radius:6px;
  display:grid;place-items:center;font:bold 16px var(--title-font);color:#fff;background:rgba(229,106,165,.18);pointer-events:none}

#strip{display:none;gap:6px;padding:6px 8px;border-top:1px solid var(--line);background:var(--face);overflow-x:auto;flex:none}
.tile{position:relative;flex:none;width:92px;cursor:pointer;border:1px solid transparent;border-radius:2px;padding:3px}
.tile:hover{border-color:var(--line);background:#fff}
.tile.on{border-color:var(--sel);background:#dce8fb}
.tile img{display:block;width:100%;height:52px;object-fit:cover;object-position:top;border:1px solid var(--line)}
.tile .meta{display:flex;justify-content:space-between;gap:4px;font-size:11px;color:var(--dim);margin-top:2px;line-height:1.25}
.tile .meta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.tile .x{position:absolute;top:6px;right:6px;opacity:0}
.tile:hover .x,.tile .x:focus-visible,.tile:focus-within .x{opacity:1}
@media (hover:none){.tile .x{opacity:1}}
.tile:focus-visible,.person:focus-visible{outline:2px solid var(--pink);outline-offset:1px}
.add-tile{flex:none;width:92px;min-height:74px;border:1px dashed var(--btn-line);border-radius:2px;background:transparent;color:var(--dim)}

.statusbar{flex:none;display:flex;gap:10px;align-items:center;padding:3px 10px;font-size:11px;color:var(--dim);background:var(--face);border-top:1px solid var(--line)}
.statusbar .cell{padding-right:10px;border-right:1px solid var(--line)}
.statusbar .end{margin-left:auto}
#status{position:fixed;bottom:44px;right:24px;display:none;z-index:5}

@media (max-width:760px){
  body{padding:0}
  .window{border-radius:0;border:0}
  main{grid-template-columns:1fr;grid-template-rows:65vh auto;overflow:auto}
  .tasks{order:0;overflow:visible;border-right:0;border-top:1px solid var(--line)}
  #right{min-height:65vh}
  .titlebar h1 span,.peek,.commands .sep{display:none}
  .statusbar .cell:not(:first-child){display:none}
}
#people{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.person{display:grid;grid-template-columns:10px minmax(0,1fr) minmax(0,1.2fr) 19px;align-items:center;gap:4px;padding:3px 4px;border:1px solid transparent;border-radius:3px;cursor:pointer}
.person:hover{background:#fff}
.person.on{background:#fff;border-color:var(--line);box-shadow:inset 3px 0 0 var(--pink)}
.person .dot{width:10px;height:10px;border-radius:50%}
.person input{min-width:0;font:12px var(--ui);color:var(--text);border:1px solid transparent;background:transparent;padding:1px 3px}
.person input:hover,.person input:focus{border-color:#7f9db9;background:#fff;outline:none}
.person input.alias::placeholder{color:#a39fb0;font-style:italic}
.small-btn{min-height:20px;padding:0 8px;font-size:11px}
.sample .opts{display:flex;gap:4px;margin-top:5px}
.sample .opts select{flex:1;min-width:0;font-size:11px;padding:1px}
.find{display:flex;gap:4px;margin-top:8px}
.find input{flex:1;min-width:0;font:12px var(--ui);border:1px solid #7f9db9;padding:2px 4px;background:#fff}
.tile.drag-over{box-shadow:-3px 0 0 var(--pink)}
.tile .crop-tag{position:absolute;left:6px;top:6px;font-size:10px;background:var(--pink);color:#fff;padding:0 4px;border-radius:2px}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <h1>censor <span>for discord screenshots</span></h1>
    <a class="by" href="https://milly.works4you.dev/" target="_blank" rel="noopener">made by milly</a>
  </div>
  <div class="commands">
    <button id="addBtn">add screenshots</button>
    <button id="copy" disabled title="copy this screenshot">copy</button>
    <button id="save" disabled>save</button>
    <button id="saveAll" class="primary" disabled>save all</button>
    <button id="stitchBtn" disabled title="join every screenshot into one tall image">stitch</button>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <span class="sep"></span>
    <div class="seg" id="mode">
      <button data-mode="match" class="on" aria-pressed="true" title="shortcut: M">hide every copy</button>
      <button data-mode="box" aria-pressed="false" title="shortcut: B">single box</button>
      <button data-mode="crop" aria-pressed="false" title="shortcut: C">crop</button>
    </div>
    <button id="uncrop" hidden>uncrop</button>
    <span class="hint peek">hold <kbd>space</kbd> to peek</span>
    <span class="spacer"></span>
    <button id="undo" disabled title="ctrl+z">undo</button>
    <button id="zoomOut" title="zoom out">−</button>
    <span id="zoomPct">100%</span>
    <button id="zoomIn" title="zoom in">+</button>
    <button id="zoomFit">fit</button>
  </div>
  <main>
    <div id="right">
      <div id="stageBox">
        <div id="banner" class="balloon"><div class="in"><span id="bannerText"></span><button class="x" id="bannerClose" title="hide tips">×</button></div></div>
        <div id="stage">
          <div id="drop">
            <strong>drop screenshots here</strong>
            or paste with ctrl+v
            <br><button class="primary" id="pickBtn">choose files</button>
          </div>
          <div id="wrap">
            <canvas id="base"></canvas>
            <canvas id="overlay"></canvas>
          </div>
        </div>
      </div>
      <div id="strip"></div>
    </div>
    <aside class="tasks">
      <section class="pane">
        <h2>people</h2>
        <div class="body">
          <div id="people"></div>
          <button id="addPerson" class="small-btn">+ add person</button>
          <label class="check" style="margin-top:8px"><input type="checkbox" id="room" checked><span>make room for longer aliases</span></label>
        </div>
      </section>
      <section class="pane">
        <h2>things to hide</h2>
        <div class="body">
          <div id="samples"></div>
          <div class="find"><input id="findName" type="text" placeholder="type a name" aria-label="name to find"><button id="findBtn" class="small-btn">find</button></div>
          <button id="timeBtn" class="small-btn" style="margin-top:6px">hide times and dates</button>
          <label class="check" style="margin-top:8px"><input type="checkbox" id="scales"><span>match other zoom levels (slow)</span></label>
        </div>
      </section>
      <section class="pane">
        <h2>look</h2>
        <div class="body">
          <div class="row"><label for="style">style</label>
            <select id="style">
              <option value="erase">erase</option>
              <option value="solid">solid</option>
              <option value="pixel">pixelate</option>
              <option value="blur">blur</option>
            </select>
            <input type="color" id="color" value="#000000" title="block colour">
          </div>
          <div class="row"><label for="pad">padding</label><input type="range" id="pad" min="0" max="12" value="2" style="width:110px"></div>
          <label class="check" style="margin-bottom:7px"><input type="checkbox" id="outlines" checked><span>show outlines</span></label>
          <label class="check" style="margin-bottom:7px"><input type="checkbox" id="plainNames" checked><span>rename files to censored-01.png</span></label>
          <p class="hint">blur and pixelate aren't safe</p>
        </div>
      </section>
      <section class="pane">
        <h2>remember</h2>
        <div class="body">
          <label class="check"><input type="checkbox" id="remember"><span>remember on this device</span></label>
        </div>
      </section>
    </aside>
  </main>
  <div class="statusbar">
    <span class="cell" id="objects">no screenshots</span>
    <span class="end"><a href="https://github.com/starsfellontrench/discord-name-censor" target="_blank" rel="noopener">github</a>&nbsp;&nbsp;<a href="https://milly.works4you.dev/" target="_blank" rel="noopener">milly.works4you.dev</a></span>
  </div>
</div>
<div id="status" class="balloon" role="status" aria-live="polite"></div>

<script id="workerSrc" type="text/plain">
const imgs = new Map();
const SCALES = [0.5, 0.67, 0.75, 0.8, 0.9, 1.1, 1.25, 1.5, 1.75, 2];
onmessage = e => {
  const m = e.data;
  if (m.type === 'image') { imgs.set(m.id, { D: m.data, W: m.w, H: m.h, cache: new Map() }); return; }
  if (m.type === 'drop') { imgs.delete(m.id); return; }
  const im = imgs.get(m.imageId);
  let matches = [], error = null;
  try { if (im) matches = m.scales ? findScaled(im, m) : findAll(im, m.tpl, m.tw, m.th, m.origin); }
  catch (err) { error = String(err && err.message || err); }
  postMessage({ imageId: m.imageId, sampleId: m.sampleId, matches, error });
};

function resize(src, sw, sh, f) {
  const w = Math.max(1, Math.round(sw * f)), h = Math.max(1, Math.round(sh * f)), out = new Uint8ClampedArray(w * h * 4);
  for (let y = 0; y < h; y++) {
    const fy = Math.min(sh - 1, Math.max(0, (y + 0.5) / f - 0.5)), y0 = Math.floor(fy), y1 = Math.min(sh - 1, y0 + 1), ty = fy - y0;
    for (let x = 0; x < w; x++) {
      const fx = Math.min(sw - 1, Math.max(0, (x + 0.5) / f - 0.5)), x0 = Math.floor(fx), x1 = Math.min(sw - 1, x0 + 1), tx = fx - x0;
      const a = (y0 * sw + x0) * 4, b = (y0 * sw + x1) * 4, c = (y1 * sw + x0) * 4, d = (y1 * sw + x1) * 4, o = (y * w + x) * 4;
      for (let k = 0; k < 3; k++) {
        out[o + k] = (src[a + k] * (1 - tx) + src[b + k] * tx) * (1 - ty) + (src[c + k] * (1 - tx) + src[d + k] * tx) * ty;
      }
      out[o + 3] = 255;
    }
  }
  return { data: out, w, h };
}

function findScaled(im, m) {
  const all = findAll(im, m.tpl, m.tw, m.th, m.origin).map(c => ({ ...c, w: m.tw, h: m.th }));
  if (Math.min(m.tw, m.th) < 16) return all;
  for (const f of SCALES) {
    const r = resize(m.tpl, m.tw, m.th, f);
    if (r.w < 5 || r.h < 5 || r.w > im.W || r.h > im.H) continue;
    for (const c of findAll(im, r.data, r.w, r.h, null)) all.push({ ...c, w: r.w, h: r.h, scaled: true });
  }
  all.sort((a, b) => b.score - a.score);
  const kept = [];
  for (const c of all) {
    if (kept.length >= 600) break;
    const clash = kept.some(k => {
      const ix = Math.max(0, Math.min(k.x + k.w, c.x + c.w) - Math.max(k.x, c.x));
      const iy = Math.max(0, Math.min(k.y + k.h, c.y + c.h) - Math.max(k.y, c.y));
      return ix * iy > 0.3 * Math.min(k.w * k.h, c.w * c.h);
    });
    if (!clash) kept.push(c);
  }
  return kept;
}

function down(D, W, H, s) {
  const w = Math.floor(W / s), h = Math.floor(H / s), a = new Float32Array(w * h * 3), k = 1 / (s * s);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let r = 0, g = 0, b = 0;
    for (let j = 0; j < s; j++) {
      let p = ((y * s + j) * W + x * s) * 4;
      for (let i = 0; i < s; i++, p += 4) { r += D[p]; g += D[p + 1]; b += D[p + 2]; }
    }
    const o = (y * w + x) * 3; a[o] = r * k; a[o + 1] = g * k; a[o + 2] = b * k;
  }
  return { a, w, h };
}

function level(im, s) {
  if (im.cache.has(s)) return im.cache.get(s);
  const L = down(im.D, im.W, im.H, s), { a, w, h } = L, iw = w + 1, size = iw * (h + 1);
  const S0 = new Float64Array(size), S1 = new Float64Array(size), S2 = new Float64Array(size), Q = new Float64Array(size);
  for (let y = 0; y < h; y++) {
    let r0 = 0, r1 = 0, r2 = 0, rq = 0;
    for (let x = 0; x < w; x++) {
      const p = (y * w + x) * 3, r = a[p], g = a[p + 1], b = a[p + 2];
      r0 += r; r1 += g; r2 += b; rq += r * r + g * g + b * b;
      const o = (y + 1) * iw + x + 1, u = y * iw + x + 1;
      S0[o] = S0[u] + r0; S1[o] = S1[u] + r1; S2[o] = S2[u] + r2; Q[o] = Q[u] + rq;
    }
  }
  Object.assign(L, { S0, S1, S2, Q, iw });
  im.cache.set(s, L);
  return L;
}

function zeroMean(T, n) {
  const mean = [0, 0, 0];
  for (let p = 0; p < n * 3; p++) mean[p % 3] += T[p];
  let tn = 0;
  for (let p = 0; p < n * 3; p++) { T[p] -= mean[p % 3] / n; tn += T[p] * T[p]; }
  return Math.sqrt(tn);
}

function scoreMap(L, T, tn, tW, tH) {
  const { a, w, h, S0, S1, S2, Q, iw } = L, n = tW * tH;
  const rect = (A, x, y) => A[(y + tH) * iw + x + tW] - A[y * iw + x + tW] - A[(y + tH) * iw + x] + A[y * iw + x];
  const ow = w - tW + 1, oh = h - tH + 1, out = new Float32Array(Math.max(0, ow * oh)), rowLen = tW * 3;
  for (let y = 0; y < oh; y++) for (let x = 0; x < ow; x++) {
    const s0 = rect(S0, x, y), s1 = rect(S1, x, y), s2 = rect(S2, x, y);
    const v = rect(Q, x, y) - (s0 * s0 + s1 * s1 + s2 * s2) / n;
    if (v <= 1e-3) continue;
    let dot = 0;
    for (let j = 0; j < tH; j++) {
      const ip = ((y + j) * w + x) * 3, tp = j * rowLen;
      for (let k = 0; k < rowLen; k++) dot += a[ip + k] * T[tp + k];

    out[y * ow + x] = dot / (tn * Math.sqrt(v));

  return { out, ow, oh };

function nccAt(im, T, tn, tw, th, x, y) {
  const { D, W, H } = im;
  if (x < 0 || y < 0 || x + tw > W || y + th > H) return -1;
  const n = tw * th;

    for (let i = 0; i < tw; i++, p += 4, t += 3) {

      s0 += r; s1 += g; s2 += b; q += r * r + g * g + b * b;

function overlaps(a, b, w, h) {
  const ix = Math.max(0, Math.min(a.x, b.x) + w - Math.max(a.x, b.x));
  const iy = Math.max(0, Math.min(a.y, b.y) + h - Math.max(a.y, b.y));
  return ix * iy > 0.3 * w * h;
}

function nms(list, w, h, limit) {
  list.sort((a, b) => b.score - a.score);
  const kept = [];
  for (const c of list) {
    if (kept.length >= limit) break;
    if (!kept.some(k => overlaps(k, c, w, h))) kept.push(c);
  }

}

function findAll(im, tpl, tw, th, origin) {

  const maxS = Math.max(1, Math.min(Math.floor(tw / 4), Math.floor(th / 4)));
  let s = 1;
  while (s < maxS && ((im.W * im.H * tw * th) / s ** 4 > 1.5e8 || (tw * th) / (s * s) > 600)) s++;

  const T = new Float32Array(tw * th * 3);
  for (let p = 0, t = 0; p < tw * th * 4; p += 4, t += 3) { T[t] = tpl[p]; T[t + 1] = tpl[p + 1]; T[t + 2] = tpl[p + 2]; }
  const tn = zeroMean(T, tw * th);
  if (tn < 1e-3) return origin ? [{ x: origin.x, y: origin.y, score: 1 }] : [];

  const L = level(im, s), floor = s === 1 ? 0.5 : 0.35, coarse = [];
  for (let qy = 0; qy < s; qy++) for (let qx = 0; qx < s; qx++) {
    const cw = tw - qx, ch = th - qy, crop = new Uint8ClampedArray(cw * ch * 4);
    for (let j = 0; j < ch; j++) crop.set(tpl.subarray(((j + qy) * tw + qx) * 4, ((j + qy) * tw + tw) * 4), j * cw * 4);
    const C = down(crop, cw, ch, s), tW = C.w, tH = C.h;
    const ctn = zeroMean(C.a, tW * tH);
    if (ctn < 1e-3 || tW > L.w || tH > L.h) continue;
    const map = scoreMap(L, C.a, ctn, tW, tH);
    for (let j = 0; j < map.oh; j++) for (let i = 0; i < map.ow; i++) {
      const v = map.out[j * map.ow + i];
      if (v >= floor) coarse.push({ x: i * s - qx, y: j * s - qy, score: v });
    }
  }
  let found = nms(coarse, tw, th, 600);
  if (s > 1) {
    found = found.map(c => {
      let best = { x: c.x, y: c.y, score: -1 };
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const v = nccAt(im, T, tn, tw, th, c.x + dx, c.y + dy);
        if (v > best.score) best = { x: c.x + dx, y: c.y + dy, score: v };
      }
      return best;
    }).filter(c => c.score >= 0.5);
    found = nms(found, tw, th, 600);
  }
  if (origin && !found.some(c => overlaps(c, origin, tw, th))) found.push({ x: origin.x, y: origin.y, score: 1 });
  return found.map(c => ({ x: c.x, y: c.y, score: Math.round(c.score * 1000) / 1000 }));
}

<script>
const $ = id => document.getElementById(id);
const base = $('base'), over = $('overlay'), bctx = base.getContext('2d'), octx = over.getContext('2d');
const COLORS = ['#e56aa5', '#9a7fe0', '#4a90e2', '#3fae2a', '#f0a030', '#1aa6b7', '#d1418a', '#7b5cd6'];
const BOX_COLOR = '#9aa0a6';
const STORE = { legacy: 'namecensor.samples.v1', data: 'namecensor.data.v2', look: 'namecensor.look.v1', hints: 'namecensor.hints.off' };
const SCALED_SLACK = 0.03;
const NAME_FONT = '"gg sans","Noto Sans","Segoe UI",Helvetica,Arial,sans-serif';
const TESSERACT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const TESSERACT_SRI = 'sha384-GJqSu7vueQ9qN0E9yLPb3Wtpd7OrgK8KmYzC8T1IysG1bcvxvIO4qtYR/D3A991F';

const workerUrl = URL.createObjectURL(new Blob([$('workerSrc').textContent], { type: 'text/javascript' }));
const POOL = [];
const pendingJobs = () => POOL.reduce((n, w) => n + (w.jobs || 0), 0);
function makeWorker(slot) {
  const w = new Worker(workerUrl);
  POOL[slot] = w;
  w.onmessage = e => { w.ok = true; onResult(e, w); };
  w.onerror = e => {
    toast('matching broke: ' + e.message, 4000);
    w.jobs = 0;
    if (w.ok) {
      makeWorker(slot);
      for (const im of S.images) {
        if (im.worker !== w) continue;
        im.worker = POOL[slot];
        sendImage(im);
        for (const s of S.samples) if (im.results.get(s.id) === null) runMatch(im, s);
      }
    }
    if (!pendingJobs()) S.waiters.splice(0).forEach(r => r());
  };
  return w;
}
for (let i = 0, n = Math.min(4, Math.max(1, (navigator.hardwareConcurrency || 2) - 1)); i < n; i++) makeWorker(i);

const S = { images: [], cur: null, samples: [], people: [], active: null, mode: 'match', zoom: 'fit', peek: false,
  undo: [], drag: null, waiters: [], focus: -1, hintsOff: false };
S.hintsOff = !!storeGet(STORE.hints);
let nextId = 1;
const uid = () => nextId++;

function storeGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function storeSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} }

function look() {
  return { style: $('style').value, color: $('color').value, pad: +$('pad').value, outlines: $('outlines').checked,
    remember: $('remember').checked, scales: $('scales').checked, room: $('room').checked, plainNames: $('plainNames').checked };
}
function saveLook() { storeSet(STORE.look, look()); }
function saveData() {
  if (!$('remember').checked) return;
  storeSet(STORE.data, {
    people: S.people.map(p => ({ id: p.id, name: p.name, alias: p.alias, color: p.color })),
    active: S.active,
    samples: S.samples.map(s => ({ label: s.label, personId: s.personId, kind: s.kind, textScale: s.textScale,
      w: s.w, h: s.h, thr: s.thr, png: s.thumb })),
  });
}

function ensurePeople() {
  if (!S.people.length) S.people.push({ id: uid(), name: 'me', alias: '', color: COLORS[0] });
  if (!S.people.some(p => p.id === S.active)) S.active = S.people[0].id;
}
function personOf(s) { return S.people.find(p => p.id === s.personId) || S.people[0]; }

function addPerson() {
  const used = new Set(S.people.map(p => p.color));
  const p = { id: uid(), name: `person ${S.people.length + 1}`, alias: '', color: COLORS.find(c => !used.has(c)) || COLORS[S.people.length % COLORS.length] };
  S.people.push(p);
  S.active = p.id;
  saveData();
  renderAll();
  document.querySelector(`.person[data-id="${p.id}"] input`)?.select();
}

function removePerson(p) {
  if (S.people.length < 2) return;
  S.people = S.people.filter(x => x !== p);
  const fallback = S.people[0].id;
  for (const s of S.samples) if (s.personId === p.id) s.personId = fallback;
  if (S.active === p.id) S.active = fallback;
  saveData();
  renderAll();
}

async function decode(file) {
  const url = URL.createObjectURL(file);
  try {
    const el = new Image();
    el.src = url;
    await el.decode();
    const w = el.naturalWidth, h = el.naturalHeight;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(el, 0, 0);
    const id = uid(), named = file.name && file.name !== 'image.png';
    const stem = named ? file.name.replace(/\.[^.]+$/, '') : `screenshot-${S.images.length + 1}`;
    const im = { id, stem, el, url, file, w, h, ctx, worker: POOL[id % POOL.length], results: new Map(), off: new Set(), boxes: [], crop: null, cache: new Map() };
    sendImage(im);
    return im;
  } catch (err) {
    URL.revokeObjectURL(url);
    throw err;
  }
}

async function addFiles(files) {
  const list = [...files].filter(f => f && f.type.startsWith('image/'));
  if (!list.length) { toast('no images'); return; }
  let first = null;
  for (const f of list) {
    try {
      const im = await decode(f);
      S.images.push(im);
      first ??= im;
      for (const s of S.samples) runMatch(im, s);
    } catch { toast(`couldn't open ${f.name || 'that image'}`); }
  }
  if (first) select(first);
  if (list.length > 1) toast(`added ${list.length}`);
}

function removeImage(im) {
  const i = S.images.indexOf(im);
  if (i < 0) return;
  S.images.splice(i, 1);
  im.worker.postMessage({ type: 'drop', id: im.id });
  URL.revokeObjectURL(im.url);
  const wasCur = S.cur === im;
  if (wasCur) { S.cur = S.images[Math.min(i, S.images.length - 1)] || null; S.focus = -1; }
  pushUndo({ undo: () => {
    S.images.splice(Math.min(i, S.images.length), 0, im);
    im.url = URL.createObjectURL(im.file);
    sendImage(im);
    if (wasCur || !S.cur) select(im);
  } });
  renderAll();
  toast('removed');
}

function select(im) {
  if (S.cur !== im) S.focus = -1;
  S.cur = im;
  renderAll();
  document.querySelector(`.tile[data-id="${im.id}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function sendImage(im) {
  const data = im.ctx.getImageData(0, 0, im.w, im.h).data;
  im.worker.postMessage({ type: 'image', id: im.id, data, w: im.w, h: im.h }, [data.buffer]);
}

function runMatch(im, s) {
  if (s.w > im.w || s.h > im.h) { im.results.set(s.id, []); return; }
  im.results.set(s.id, null);
  im.worker.jobs = (im.worker.jobs || 0) + 1;
  const origin = s.origin && s.origin.imageId === im.id ? { x: s.origin.x, y: s.origin.y } : null;
  im.worker.postMessage({ type: 'match', imageId: im.id, sampleId: s.id, tpl: s.data, tw: s.w, th: s.h, origin, scales: $('scales').checked });
  showProgress();
}

function rematchAll() {
  for (const im of S.images) for (const s of S.samples) runMatch(im, s);
  renderAll();
}

function onResult(e, w) {
  const { imageId, sampleId, matches, error } = e.data;
  w.jobs = Math.max(0, (w.jobs || 0) - 1);
  if (error) toast('matching failed on one screenshot: ' + error, 4000);
  const im = S.images.find(i => i.id === imageId);
  if (im && S.samples.some(s => s.id === sampleId) && im.results.has(sampleId)) {
    im.results.set(sampleId, matches);
    if (im === S.cur) renderStage();
  }
  renderCounts();
  showProgress();
  if (!pendingJobs()) S.waiters.splice(0).forEach(r => r());
}

function idle() { return pendingJobs() ? new Promise(r => S.waiters.push(r)) : Promise.resolve(); }

function showProgress() {
  const n = pendingJobs();
  if (n) setStatus(`matching… ${n} left`);
  else if ($('status').dataset.kind === 'progress') setStatus('');
}

function trim(im, r) {
  const d = im.ctx.getImageData(r.x, r.y, r.w, r.h).data, w = r.w, h = r.h;
  const counts = new Map();
  const border = (x, y) => { const p = (y * w + x) * 4, k = (d[p] >> 3) << 10 | (d[p + 1] >> 3) << 5 | d[p + 2] >> 3; counts.set(k, (counts.get(k) || 0) + 1); };
  for (let x = 0; x < w; x++) { border(x, 0); border(x, h - 1); }
  for (let y = 0; y < h; y++) { border(0, y); border(w - 1, y); }

  for (const [k, c] of counts) if (c > best) { best = c; bgKey = k; }

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const p = (y * w + x) * 4;
    if (Math.abs(d[p] - br) + Math.abs(d[p + 1] - bg) + Math.abs(d[p + 2] - bb) > 40) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;

  if (x1 - x0 < 2 || y1 - y0 < 2) return r;
  x0 = Math.max(0, x0 - 1); y0 = Math.max(0, y0 - 1); x1 = Math.min(w - 1, x1 + 1); y1 = Math.min(h - 1, y1 + 1);
  return { x: r.x + x0, y: r.y + y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}

function pngOf(data, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(data), w, h), 0, 0);
  return c.toDataURL('image/png');
}

function guessKind(w, h) { return h >= 14 && Math.abs(w - h) <= Math.max(w, h) * 0.25 ? 'avatar' : 'name'; }

function addSample(s, index = S.samples.length) {
  S.samples.splice(index, 0, s);
  for (const im of S.images) runMatch(im, s);
  saveData();
  renderAll();
}

function removeSample(s, undoable = true) {
  const i = S.samples.indexOf(s);
  if (i < 0) return;
  S.samples.splice(i, 1);
  for (const im of S.images) im.results.delete(s.id);
  if (undoable) pushUndo({ undo: () => addSample(s, i) });

  renderAll();

function sampleFromSelection(im, r) {
  ensurePeople();
  r = trim(im, r);
  if (!r) { toast('nothing in that box'); drawOverlay(); return null; }
  const data = im.ctx.getImageData(r.x, r.y, r.w, r.h).data;
  const kind = guessKind(r.w, r.h);
  const n = S.samples.filter(s => s.kind === kind).length + 1;
  const s = { id: uid(), label: `${kind} ${n}`, personId: S.active, kind, textScale: 1, w: r.w, h: r.h, data, thr: 0.97,
    origin: { imageId: im.id, x: r.x, y: r.y }, thumb: pngOf(data, r.w, r.h) };

  pushUndo({ undo: () => removeSample(s, false) });

async function loadSample(o, personId) {
  const el = new Image(); el.src = o.png; await el.decode();
  const c = document.createElement('canvas'); c.width = o.w; c.height = o.h;
  const ctx = c.getContext('2d', { willReadFrequently: true }); ctx.drawImage(el, 0, 0);

async function restoreData() {
  const saved = storeGet(STORE.data);
  if (saved && Array.isArray(saved.people)) {
    const ids = new Map();
    for (const p of saved.people) {
      if (!p || typeof p !== 'object') continue;
      const np = { id: uid(), name: String(p.name ?? 'me'), alias: String(p.alias ?? ''), color: /^#[0-9a-f]{6}$/i.test(p.color) ? p.color : COLORS[0] };

function regions(im) {
  const out = [];
  for (const s of S.samples) {
    const res = im.results.get(s.id);
    if (!res) continue;
    const color = personOf(s)?.color || COLORS[0];
    for (const m of res) {

    }

  for (const b of im.boxes) out.push({ x: b.x, y: b.y, w: b.w, h: b.h, box: b, on: true, color: BOX_COLOR });

}

function reviewList(im) { return regions(im).sort((a, b) => a.y - b.y || a.x - b.x); }

function padRect(r, im) {
  const p = +$('pad').value;
  const x = Math.max(0, r.x - p), y = Math.max(0, r.y - p);

function isPending(im) { return S.samples.some(s => im.results.get(s.id) === null); }
function countOn(im) { return regions(im).filter(r => r.on).length; }

function cached(im, key, fn) {
  if (!im.cache.has(key)) im.cache.set(key, fn());
  return im.cache.get(key);
}

function backgroundAround(im, r) {
  return cached(im, `bg:${r.x},${r.y},${r.w},${r.h}`, () => {
    const m = 2, x0 = Math.max(0, r.x - m), y0 = Math.max(0, r.y - m);
    const x1 = Math.min(im.w, r.x + r.w + m), y1 = Math.min(im.h, r.y + r.h + m), w = x1 - x0, h = y1 - y0;
    const d = im.ctx.getImageData(x0, y0, w, h).data, counts = new Map();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {

    for (const [k, c] of counts) if (c > best) { best = c; key = k; }

function inkColor(im, r) {
  return cached(im, `ink:${r.x},${r.y},${r.w},${r.h}`, () => {
    const bgHex = parseInt(backgroundAround(im, r).slice(1), 16), br = bgHex >> 16 & 255, bgc = bgHex >> 8 & 255, bb = bgHex & 255;
    const d = im.ctx.getImageData(r.x, r.y, r.w, r.h).data, buckets = new Map();

      const k = (d[p] >> 4) << 8 | (d[p + 1] >> 4) << 4 | d[p + 2] >> 4;

      buckets.set(k, b);
    }
    let top = null;
    for (const b of buckets.values()) if (!top || b.n > top.n) top = b;

    return `rgb(${Math.round(top.r / top.n)},${Math.round(top.g / top.n)},${Math.round(top.b / top.n)})`;

    ctx.restore(); return;
  }
  const b = Math.max(5, Math.round(Math.min(r.w, r.h) / 3));
  const t = document.createElement('canvas'); t.width = Math.max(1, Math.ceil(r.w / b)); t.height = Math.max(1, Math.ceil(r.h / b));
  t.getContext('2d').drawImage(src, r.x, r.y, r.w, r.h, 0, 0, t.width, t.height);
  ctx.save(); ctx.imageSmoothingEnabled = false; ctx.drawImage(t, 0, 0, t.width, t.height, r.x, r.y, r.w, r.h); ctx.restore();
}

function aliasText(r) {
  const s = r.sample, p = s && personOf(s), text = p?.alias.trim();
  return text && s.kind !== 'other' ? { s, p, text } : null;
}

function drawAvatarAlias(ctx, r, p, text) {
  const d = Math.min(r.w, r.h), cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  ctx.save();
  ctx.fillStyle = p.color;
  ctx.beginPath(); ctx.arc(cx, cy, d / 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${Math.round(d * 0.5)}px ${NAME_FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText([...text][0].toUpperCase(), cx, cy + d * 0.03);
  ctx.restore();
}

function nameLayout(ctx, im, r, s, p, text) {
  ctx.save();
  ctx.font = `600 100px ${NAME_FONT}`;
  const ref = p.name.trim() && ctx.measureText(p.name.trim());
  const refH = ref ? ref.actualBoundingBoxAscent + ref.actualBoundingBoxDescent : 0;
  const fits = refH > 0 && Math.abs((ref.width * r.h) / refH - r.w) < r.w * 0.35;
  const size = Math.max(6, (fits ? (r.h * 100) / refH : r.h / 0.8) * (s.textScale || 1));
  const font = `600 ${size.toFixed(1)}px ${NAME_FONT}`;
  ctx.font = font;
  const m = ctx.measureText(text);
  ctx.restore();
  const y = fits ? r.y + r.h - (ref.actualBoundingBoxDescent * r.h) / refH : r.y + r.h / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
  return { font, y, width: m.width, gap: Math.max(2, size * 0.3) };
}

function makeRoom(ctx, im, r, need) {
  const pad = Math.round(r.h * 0.2), y0 = Math.max(0, r.y - pad), y1 = Math.min(im.h, r.y + r.h + pad), h = y1 - y0;
  const x0 = r.x + r.w, w = im.w - x0 - need;
  if (w <= 0 || h <= 0) return;
  const t = document.createElement('canvas'); t.width = w; t.height = h;
  t.getContext('2d').drawImage(ctx.canvas, x0, y0, w, h, 0, 0, w, h);
  ctx.fillStyle = backgroundAround(im, r);
  ctx.fillRect(x0, y0, im.w - x0, h);
  ctx.drawImage(t, x0 + need, y0);
}

function paint(ctx, im, peek) {
  ctx.drawImage(im.el, 0, 0);
  if (peek) return;
  const on = regions(im).filter(r => r.on);
  for (const r of on) censor(ctx, im, padRect(r, im));
  const shifts = [];
  const names = [];
  for (const r of on) {
    const a = aliasText(r);
    if (!a) continue;
    if (a.s.kind === 'avatar') drawAvatarAlias(ctx, r, a.p, a.text);
    else names.push({ r, ...a });
  }
  names.sort((u, v) => u.r.y - v.r.y || u.r.x - v.r.x);
  for (const { r: orig, s, p, text } of names) {
    const cy = orig.y + orig.h / 2;
    const dx = shifts.filter(k => cy >= k.y0 && cy < k.y1 && orig.x >= k.x).reduce((t, k) => t + k.need, 0);
    const r = { ...orig, x: orig.x + dx };
    const L = nameLayout(ctx, im, r, s, p, text);
    const need = Math.ceil(L.width - r.w + (L.width > r.w ? L.gap : 0));
    if ($('room').checked && need > 0) {
      makeRoom(ctx, im, r, need);
      const pad = Math.round(r.h * 0.2);
      shifts.push({ y0: r.y - pad, y1: r.y + r.h + pad, x: orig.x + orig.w, need });
    }
    ctx.save();
    ctx.font = L.font; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = inkColor(im, orig);
    ctx.fillText(text, r.x, L.y);
    ctx.restore();
  }
}

function renderCanvas(im) {
  const c = document.createElement('canvas'); c.width = im.w; c.height = im.h;
  paint(c.getContext('2d'), im, false);
  if (!im.crop) return c;
  const k = im.crop, out = document.createElement('canvas'); out.width = k.w; out.height = k.h;
  out.getContext('2d').drawImage(c, k.x, k.y, k.w, k.h, 0, 0, k.w, k.h);
  return out;
}

function zoomFactor() {
  const im = S.cur;
  if (!im) return 1;
  if (S.zoom !== 'fit') return S.zoom;
  return Math.max(0.1, Math.min(2, ($('stage').clientWidth - 32) / im.w));
}

function renderStage() {
  const im = S.cur;
  $('drop').style.display = im ? 'none' : '';
  $('wrap').style.display = im ? 'block' : 'none';
  $('uncrop').hidden = !im?.crop;
  if (!im) { renderBanner(); return; }
  if (base.width !== im.w || base.height !== im.h) { base.width = over.width = im.w; base.height = over.height = im.h; }
  const z = zoomFactor();
  $('wrap').style.width = Math.round(im.w * z) + 'px';
  over.style.width = '100%';
  $('zoomPct').textContent = Math.round(z * 100) + '%';
  paint(bctx, im, S.peek);
  drawOverlay();
  renderBanner();
}

function drawOverlay() {
  const im = S.cur;
  octx.clearRect(0, 0, over.width, over.height);
  if (!im) return;
  const k = im.w / (over.getBoundingClientRect().width || im.w);
  if (im.crop && !S.peek) {
    const c = im.crop;
    octx.fillStyle = 'rgba(20,10,30,.55)';
    octx.fillRect(0, 0, im.w, c.y);
    octx.fillRect(0, c.y + c.h, im.w, im.h - c.y - c.h);
    octx.fillRect(0, c.y, c.x, c.h);
    octx.fillRect(c.x + c.w, c.y, im.w - c.x - c.w, c.h);
    octx.lineWidth = 1.5 * k; octx.setLineDash([6 * k, 4 * k]); octx.strokeStyle = '#ffffff';
    octx.strokeRect(c.x, c.y, c.w, c.h);
  }
  octx.lineWidth = 2 * k;
  if ($('outlines').checked && !S.peek) {
    const list = reviewList(im), focused = list[S.focus];
    for (const r of list) {
      const p = padRect(r, im);
      octx.strokeStyle = r.color;
      octx.setLineDash(r.on ? [] : [4 * k, 3 * k]);
      octx.globalAlpha = r.on ? 1 : 0.8;
      octx.strokeRect(p.x, p.y, p.w, p.h);
    }
    octx.globalAlpha = 1;
    if (focused) {
      const p = padRect(focused, im);
      octx.setLineDash([]);
      octx.lineWidth = 5 * k; octx.strokeStyle = '#ffffff'; octx.strokeRect(p.x - 3 * k, p.y - 3 * k, p.w + 6 * k, p.h + 6 * k);
      octx.lineWidth = 2.5 * k; octx.strokeStyle = focused.color; octx.strokeRect(p.x - 3 * k, p.y - 3 * k, p.w + 6 * k, p.h + 6 * k);
    }
  }
  octx.lineWidth = 2 * k;
  if (S.drag && S.drag.moved) {
    const r = dragRect(S.drag);
    octx.setLineDash([5 * k, 4 * k]); octx.strokeStyle = '#ffffff'; octx.strokeRect(r.x, r.y, r.w, r.h);
    octx.lineDashOffset = 5 * k; octx.strokeStyle = '#000000'; octx.strokeRect(r.x, r.y, r.w, r.h);
    octx.lineDashOffset = 0;
  }
  octx.setLineDash([]);
}

const HINTS = [
  'drag a box around your name',
  'now your avatar',
  'reply lines too, the small name',
  'and the small avatar',
];

function renderBanner() {
  const n = S.samples.length;
  let text = '';
  if (S.mode === 'crop' && S.cur) text = 'drag over the part to keep';
  else if (S.cur && !S.hintsOff && S.mode === 'match' && n < HINTS.length && S.samples.every(s => s.origin) && !(n === 0 && S.cur.boxes.length)) text = HINTS[n];
  $('bannerText').textContent = text;
  $('bannerClose').hidden = S.mode === 'crop';
  $('banner').style.display = text ? 'block' : 'none';
}

function renderPeople() {
  ensurePeople();
  const el = $('people');
  el.innerHTML = '';
  for (const p of S.people) {
    const d = document.createElement('div');
    d.className = 'person' + (p.id === S.active ? ' on' : '');
    d.dataset.id = p.id;
    d.tabIndex = 0; d.setAttribute('role', 'button'); d.setAttribute('aria-pressed', String(p.id === S.active));
    d.innerHTML = `<span class="dot"></span><input type="text" aria-label="person name"><input type="text" class="alias" aria-label="alias" placeholder="alias"><button class="x" title="remove person">×</button>`;
    d.querySelector('.dot').style.background = p.color;

    alias.oninput = () => { p.alias = alias.value; saveData(); renderStage(); renderSamples(); };
    for (const i of [name, alias]) i.onkeydown = e => { if (e.key === 'Enter' || e.key === 'Escape') i.blur(); };

    };

    const x = d.querySelector('.x');
    x.disabled = S.people.length < 2;
    x.onclick = () => removePerson(p);
    el.appendChild(d);
  }
}

function renderSampleOptions() {
  for (const sel of document.querySelectorAll('.sample select.who')) {

function renderSamples() {
  const el = $('samples');

  }

  for (const s of S.samples) {

    const d = document.createElement('div');
    d.className = 'sample'; d.dataset.id = s.id;
    d.innerHTML = `<div class="top">
        <span class="thumb"><img alt=""></span>

        </select>
      </div>

    d.querySelector('.thumb').style.borderColor = p.color;
    d.querySelector('img').src = s.thumb;
    const name = d.querySelector('input[type=text]');

    name.oninput = () => { s.label = name.value || 'item'; saveData(); };

    for (const q of S.people) who.add(new Option(q.name || 'unnamed', q.id));
    who.value = s.personId;
    who.onchange = () => { s.personId = +who.value; saveData(); renderAll(); };
    const kind = d.querySelector('.kind');
    kind.value = s.kind;
    kind.onchange = () => { s.kind = kind.value; saveData(); renderAll(); };
    const range = d.querySelector('.sim'), pct = d.querySelector('.thr span');
    range.value = Math.round(s.thr * 100); pct.textContent = range.value + '%';
    range.oninput = () => { s.thr = range.value / 100; pct.textContent = range.value + '%'; renderStage(); renderCounts(); };
    range.onchange = saveData;
    if (s.kind === 'name' && p.alias.trim()) {
      const t = document.createElement('div');
      t.className = 'thr';
      t.innerHTML = `<label>alias size</label><input type="range" min="50" max="200" step="5"><span></span>`;
      const tr = t.querySelector('input'), tp = t.querySelector('span');
      tr.value = Math.round(s.textScale * 100); tp.textContent = tr.value + '%';
      tr.oninput = () => { s.textScale = tr.value / 100; tp.textContent = tr.value + '%'; renderStage(); };
      tr.onchange = saveData;
      d.appendChild(t);
    }
    d.querySelector('.x').onclick = () => removeSample(s);
    el.appendChild(d);
  }
  renderCounts();
}

let dragTile = null;
function renderStrip() {
  const el = $('strip');
  el.style.display = S.images.length ? 'flex' : 'none';
  el.innerHTML = '';
  for (const im of S.images) {
    const t = document.createElement('div');
    t.className = 'tile' + (im === S.cur ? ' on' : ''); t.dataset.id = im.id;
    t.title = `${im.stem} (drag to reorder)`;
    t.draggable = true;
    t.tabIndex = 0; t.setAttribute('role', 'button'); t.setAttribute('aria-label', 'show ' + im.stem); t.setAttribute('aria-pressed', String(im === S.cur));
    t.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === t) { e.preventDefault(); e.stopPropagation(); select(im); } };
    t.innerHTML = `<img alt="" draggable="false"><div class="meta"><span></span><span class="n"></span></div><button class="x" title="remove screenshot">×</button>`;
    t.querySelector('img').src = im.url;
    t.querySelector('.meta span').textContent = im.stem;
    if (im.crop) t.insertAdjacentHTML('afterbegin', '<span class="crop-tag">cropped</span>');
    t.onclick = e => { if (!e.target.closest('.x')) select(im); };
    t.querySelector('.x').onclick = () => removeImage(im);
    t.ondragstart = e => { dragTile = im; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(im.id)); };
    t.ondragend = () => { dragTile = null; document.querySelectorAll('.tile.drag-over').forEach(x => x.classList.remove('drag-over')); };
    t.ondragover = e => { if (!dragTile || dragTile === im) return; e.preventDefault(); t.classList.add('drag-over'); };
    t.ondragleave = () => t.classList.remove('drag-over');
    t.ondrop = e => {
      if (!dragTile || dragTile === im) return;
      e.preventDefault(); e.stopPropagation();
      const from = S.images.indexOf(dragTile);
      S.images.splice(from, 1);
      S.images.splice(S.images.indexOf(im), 0, dragTile);
      dragTile = null;
      renderStrip();
    };
    el.appendChild(t);
  }
  const add = document.createElement('button');
  add.className = 'add-tile'; add.textContent = '+ add';
  add.onclick = () => $('file').click();
  el.appendChild(add);
  renderCounts();
}

function renderCounts() {
  for (const s of S.samples) {
    const c = document.querySelector(`.sample[data-id="${s.id}"] .count`);
    if (!c) continue;
    const busy = S.images.some(im => im.results.get(s.id) === null);
    let n = 0;
    for (const im of S.images) for (const r of regions(im)) if (r.sample === s && r.on) n++;
    c.textContent = busy ? 'searching…' : `${n} hidden`;
  }
  for (const im of S.images) {
    const c = document.querySelector(`.tile[data-id="${im.id}"] .n`);
    if (c) c.textContent = isPending(im) ? '…' : `${countOn(im)} hidden`;
  }
  const has = S.images.length > 0;
  $('save').disabled = $('copy').disabled = !S.cur;
  $('saveAll').disabled = !has;
  $('stitchBtn').disabled = S.images.length < 2;
  $('saveAll').textContent = S.images.length > 1 ? `save all (${S.images.length})` : 'save all';
  const hiddenTotal = S.images.reduce((n, im) => n + countOn(im), 0);
  $('objects').textContent = S.images.length ? `${S.images.length} screenshot${S.images.length > 1 ? 's' : ''} · ${hiddenTotal} hidden` : 'no screenshots';
  $('undo').disabled = !S.undo.length;
}

function renderAll() { renderStage(); renderPeople(); renderSamples(); renderStrip(); }

function pushUndo(u) { S.undo.push(u); if (S.undo.length > 100) S.undo.shift(); renderCounts(); }
function undo() {
  const u = S.undo.pop();
  if (!u) return;
  u.undo();
  renderAll();
}

function toImage(e) {
  const r = over.getBoundingClientRect();
  return {
    x: Math.round((e.clientX - r.left) * S.cur.w / r.width),
    y: Math.round((e.clientY - r.top) * S.cur.h / r.height),
  };
}

function dragRect(d) {
  const im = S.cur;
  const x0 = Math.max(0, Math.min(d.a.x, d.b.x)), y0 = Math.max(0, Math.min(d.a.y, d.b.y));
  const x1 = Math.min(im.w, Math.max(d.a.x, d.b.x)), y1 = Math.min(im.h, Math.max(d.a.y, d.b.y));
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

function hit(p) {
  const im = S.cur, rs = regions(im);
  for (let i = rs.length - 1; i >= 0; i--) {
    const q = padRect(rs[i], im);
    if (p.x >= q.x && p.y >= q.y && p.x <= q.x + q.w && p.y <= q.y + q.h) return rs[i];
  }
  return null;
}

function setCrop(im, c) {
  const prev = im.crop;
  im.crop = c;
  pushUndo({ image: im, undo: () => { im.crop = prev; } });
  renderStage(); renderStrip();
}

over.addEventListener('pointerdown', e => {
  if (!S.cur || e.button !== 0) return;
  over.setPointerCapture(e.pointerId);
  const p = toImage(e);
  S.drag = { a: p, b: p, moved: false };
});
over.addEventListener('pointermove', e => {
  if (!S.cur) return;
  const p = toImage(e);
  if (!S.drag) { over.style.cursor = S.mode !== 'crop' && hit(p) ? 'pointer' : 'crosshair'; return; }
  S.drag.b = p;
  if (Math.abs(p.x - S.drag.a.x) + Math.abs(p.y - S.drag.a.y) > 4) S.drag.moved = true;
  drawOverlay();
});
over.addEventListener('pointerup', () => {
  const d = S.drag;
  S.drag = null;
  if (!d) return;
  if (!d.moved) { if (S.mode !== 'crop') toggleAt(d.a); return; }
  const r = dragRect(d);
  if (r.w < 3 || r.h < 3) { drawOverlay(); return; }
  const im = S.cur;
  if (S.mode === 'crop') { if (r.w >= 16 && r.h >= 16) setCrop(im, r); else drawOverlay(); return; }
  if (S.mode === 'box') {
    im.boxes.push(r);
    pushUndo({ image: im, undo: () => { im.boxes = im.boxes.filter(b => b !== r); } });
    renderStage(); renderCounts();
  } else sampleFromSelection(im, r);
});
over.addEventListener('pointercancel', () => { S.drag = null; drawOverlay(); });

function toggleRegion(im, r) {
  if (r.box) {
    const i = im.boxes.indexOf(r.box);
    im.boxes.splice(i, 1);
    pushUndo({ image: im, undo: () => im.boxes.splice(i, 0, r.box) });
  } else {
    const flip = () => im.off.has(r.key) ? im.off.delete(r.key) : im.off.add(r.key);
    flip();
    pushUndo({ image: im, undo: flip });
  }
  renderStage(); renderCounts();
}

function toggleAt(p) {
  const r = hit(p);
  if (r) toggleRegion(S.cur, r);
}

function step(dir) {
  if (!S.cur) return;
  const list = reviewList(S.cur);
  if (!list.length) { toast('nothing hidden on this screenshot yet'); return; }
  S.focus = S.focus < 0 ? (dir > 0 ? 0 : list.length - 1) : (S.focus + dir + list.length) % list.length;
  const r = list[S.focus];
  const o = over.getBoundingClientRect(), st = $('stage'), sr = st.getBoundingClientRect(), k = o.width / S.cur.w;
  st.scrollTo({
    left: st.scrollLeft + (o.left - sr.left) + (r.x + r.w / 2) * k - sr.width / 2,
    top: st.scrollTop + (o.top - sr.top) + (r.y + r.h / 2) * k - sr.height / 2,
    behavior: 'smooth',
  });
  drawOverlay();
  toast(`${S.focus + 1} / ${list.length}${r.on ? '' : ' (off)'}`, 1500);
}

function toggleFocused() {
  if (!S.cur) return;
  const r = reviewList(S.cur)[S.focus];
  if (r) { toggleRegion(S.cur, r); toast(r.box ? 'box removed' : (S.cur.off.has(r.key) ? 'match off' : 'match on'), 1200); }
}

function canvasBlob(c) { return new Promise(r => c.toBlob(r, 'image/png')); }

function saveBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function waitForMatches() {
  if (!pendingJobs()) return;
  setStatus('matching…', 'progress');
  await idle();
}

function exportNames() {
  const used = new Set();
  return S.images.map(im => {
    if (!$('plainNames').checked) {
      let n = 1, name;
      do name = `${im.stem}${n > 1 ? '-' + n : ''}-censored.png`; while (used.has(name.toLowerCase()) && ++n);
      used.add(name.toLowerCase());
      return name;
    }
    return `censored-${String(S.images.indexOf(im) + 1).padStart(2, '0')}.png`;
  });
}

async function downloadCurrent() {
  if (!S.cur) return;
  await waitForMatches();
  saveBlob(await canvasBlob(renderCanvas(S.cur)), exportNames()[S.images.indexOf(S.cur)]);
}

async function downloadAll() {
  if (!S.images.length) return;
  if (S.images.length === 1) return downloadCurrent();
  await waitForMatches();
  const names = exportNames();
  if (window.JSZip) {
    setStatus('zipping…');
    const zip = new JSZip();
    for (let i = 0; i < S.images.length; i++) zip.file(names[i], await canvasBlob(renderCanvas(S.images[i])), { date: new Date(2000, 0, 1) });
    saveBlob(await zip.generateAsync({ type: 'blob' }), 'censored-screenshots.zip');
    toast('saved zip');
  } else {
    for (let i = 0; i < S.images.length; i++) {
      saveBlob(await canvasBlob(renderCanvas(S.images[i])), names[i]);
      await new Promise(r => setTimeout(r, 300));
    }
    toast('saved');
  }
}

function rowHashes(im) {
  const k = im.crop || { x: 0, y: 0, w: im.w, h: im.h };
  const d = new Uint32Array(im.ctx.getImageData(k.x, k.y, k.w, k.h).data.buffer), out = new Uint32Array(k.h);
  for (let y = 0; y < k.h; y++) {
    let h = 2166136261;
    for (let x = 0, p = y * k.w; x < k.w; x++, p++) h = Math.imul(h ^ d[p], 16777619);
    out[y] = h >>> 0;
  }
  return out;
}

function overlapRows(a, b) {
  const max = Math.min(a.length, b.length) - 1;
  for (let k = max; k >= 24; k--) {
    let ok = true;
    for (let j = 0, off = a.length - k; j < k; j++) if (a[off + j] !== b[j]) { ok = false; break; }
    if (ok && new Set(b.subarray(0, k)).size > 4) return k;
  }
  return 0;
}

async function stitch() {
  if (S.images.length < 2) return;
  await waitForMatches();
  setStatus('stitching…');
  await new Promise(r => setTimeout(r, 30));
  const parts = S.images.map(im => ({ im, c: renderCanvas(im), rows: rowHashes(im) }));
  let height = 0, removed = 0;
  parts.forEach((p, i) => {
    const prev = parts[i - 1];
    p.overlap = prev && prev.c.width === p.c.width ? overlapRows(prev.rows, p.rows) : 0;
    removed += p.overlap;
    p.y = height - p.overlap;
    height = p.y + p.c.height;
  });
  const width = Math.max(...parts.map(p => p.c.width));
  if (width * height > 268e6 || height > 32000) { setStatus(''); toast('too big to stitch', 3000); return; }
  const out = document.createElement('canvas'); out.width = width; out.height = height;
  const ctx = out.getContext('2d');
  const first = S.images[0];
  ctx.fillStyle = backgroundAround(first, { x: 2, y: 2, w: 1, h: 1 });
  ctx.fillRect(0, 0, width, height);
  for (const p of parts) ctx.drawImage(p.c, 0, p.y);
  saveBlob(await canvasBlob(out), 'stitched-censored.png');
  setStatus('');
  toast('stitched');
}

async function copyCurrent() {
  if (!S.cur) return;
  try {
    await waitForMatches();
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': canvasBlob(renderCanvas(S.cur)) })]);
    toast('copied');
  } catch { toast("couldn't copy, use save", 3000); }
}

let tessWorker = null;
function loadTesseract() {
  tessWorker ??= new Promise((resolve, reject) => {
    if (window.Tesseract) return resolve(window.Tesseract);
    const s = document.createElement('script');
    s.src = TESSERACT_URL;
    s.integrity = TESSERACT_SRI;
    s.crossOrigin = 'anonymous';
    s.onload = () => resolve(window.Tesseract);
    s.onerror = () => reject(new Error('could not load the text reader'));
    document.head.appendChild(s);
  }).then(T => T.createWorker('eng')).catch(err => { tessWorker = null; throw err; });
  return tessWorker;
}

const norm = t => t.toLowerCase().normalize('NFKD').replace(/[^\p{L}\p{N}]/gu, '');
function editDistance(a, b) {
  const row = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = row[0]; row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = row[j];
      row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return row[b.length];
}
const nameMatches = (word, target) => word === target || (target.length >= 4 && Math.abs(word.length - target.length) <= 1 && editDistance(word, target) <= 1);

function ocrCanvas(im, f = 2) {
  f = Math.min(f, Math.sqrt(2 ** 24 / (im.w * im.h)));
  const c = document.createElement('canvas'); c.width = Math.round(im.w * f); c.height = Math.round(im.h * f);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(im.el, 0, 0, c.width, c.height);
  const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data;
  let sum = 0;
  for (let p = 0; p < d.length; p += 16) sum += d[p] * 0.299 + d[p + 1] * 0.587 + d[p + 2] * 0.114;
  const dark = sum / (d.length / 16) < 128;
  for (let p = 0; p < d.length; p += 4) {
    let g = d[p] * 0.299 + d[p + 1] * 0.587 + d[p + 2] * 0.114;
    if (dark) g = 255 - g;
    d[p] = d[p + 1] = d[p + 2] = g;
  }
  ctx.putImageData(img, 0, 0);
  return { c, f };
}

function wordsOf(data) {
  if (Array.isArray(data.words) && data.words.length) return data.words;
  const out = [];
  for (const b of data.blocks || []) for (const p of b.paragraphs || []) for (const l of p.lines || []) out.push(...(l.words || []));
  return out;
}

function linesOf(data) {
  if (Array.isArray(data.lines) && data.lines.length) return data.lines;
  const out = [];
  for (const b of data.blocks || []) for (const p of b.paragraphs || []) out.push(...(p.lines || []));
  return out;
}

const MONTH = /^(jan(uary)?|feb(ruary)?|mar(ch)?|apr(il)?|may|june?|july?|aug(ust)?|sep(t(ember)?)?|oct(ober)?|nov(ember)?|dec(ember)?)\.?,?$/i;
function timeToken(t) {
  t = t.replace(/^[—–\-•·(\[]+|[)\]]+$/g, '');
  if (/^\d{1,2}[:.]\d{2}([:.]\d{2})?([ap]\.?m\.?)?,?$/i.test(t)) return 'strong';
  if (/^\d{1,4}[\/.\-]\d{1,2}[\/.\-]\d{2,4},?$/.test(t)) return 'strong';
  if (MONTH.test(t)) return 'month';
  if (/^\d{1,4}(st|nd|rd|th)?,?$/i.test(t)) return 'number';
  if (/^([ap]\.?m\.?|at|today|yesterday|tomorrow|monday|tuesday|wednesday|thursday|friday|saturday|sunday|—|–|-)$/i.test(t)) return 'weak';
  return null;
}

function timeRuns(words) {
  const runs = [];
  let cur = [];
  const flush = () => {
    const kinds = cur.map(w => w.kind);
    const keep = kinds.includes('strong') || (kinds.includes('month') && kinds.includes('number'));
    if (keep) {
      while (cur.length && /^(at|—|–|-)$/i.test(cur[0].text)) cur.shift();
      if (cur.length) runs.push(cur);
    }
    cur = [];
  };
  const last = words.length - 1;
  for (const [i, w] of words.entries()) {
    const text = (w.text || '').trim();
    const kind = i === last && words.length <= 4 && /^([01]?\d|2[0-3])[0-5]\d$/.test(text) ? 'strong' : timeToken(text);
    if (kind) cur.push({ ...w, kind }); else flush();
  }
  flush();
  return runs;
}

async function hideTimes() {
  if (!S.images.length) { toast('add a screenshot first'); return; }
  $('timeBtn').disabled = true;
  try {
    setStatus('loading text reader…');
    const w = await loadTesseract();
    let added = 0;
    const undoList = [];
    for (const [i, im] of S.images.entries()) {
      setStatus(`reading ${i + 1}/${S.images.length}…`);
      const covered = regions(im).filter(q => q.on);
      for (const scale of [3, 2]) {
        const { c, f } = ocrCanvas(im, scale);
        const { data } = await w.recognize(c, {}, { blocks: true });
        for (const line of linesOf(data)) for (const run of timeRuns(line.words || [])) {
          const x0 = Math.min(...run.map(q => q.bbox.x0)), y0 = Math.min(...run.map(q => q.bbox.y0));
          const x1 = Math.max(...run.map(q => q.bbox.x1)), y1 = Math.max(...run.map(q => q.bbox.y1));
          const r = { x: Math.max(0, Math.floor(x0 / f) - 2), y: Math.max(0, Math.floor(y0 / f) - 2) };
          r.w = Math.min(im.w, Math.ceil(x1 / f) + 2) - r.x;
          r.h = Math.min(im.h, Math.ceil(y1 / f) + 2) - r.y;
          const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
          if (covered.some(q => cx >= q.x && cx <= q.x + q.w && cy >= q.y && cy <= q.y + q.h)) continue;
          r.time = true;
          im.boxes.push(r); covered.push(r); undoList.push([im, r]);
          added++;
        }
      }
    }
    if (undoList.length) pushUndo({ undo: () => { for (const [im, r] of undoList) im.boxes = im.boxes.filter(b => b !== r); } });
    setStatus('');
    renderStage(); renderStrip(); renderCounts();
    toast(added ? `hid ${added}` : 'no times found', 2500);
  } catch (err) {
    setStatus('');
    toast(String(err.message || err), 3500);
  } finally {
    $('timeBtn').disabled = false;
  }
}

async function findByName() {
  const target = norm($('findName').value);
  if (!target) { $('findName').focus(); return; }
  if (!S.images.length) { toast('add a screenshot first'); return; }
  $('findBtn').disabled = true;
  try {
    setStatus('loading text reader…');
    const w = await loadTesseract();
    let added = 0, seen = 0;
    const order = [S.cur, ...S.images.filter(i => i !== S.cur)];
    for (const [i, im] of order.entries()) {
      setStatus(`reading ${i + 1}/${order.length}…`);
      const { c, f } = ocrCanvas(im);
      const { data } = await w.recognize(c, {}, { blocks: true });
      const hits = wordsOf(data).filter(x => nameMatches(norm(x.text || ''), target));
      seen += hits.length;
      for (const h of hits) {
        const r = { x: Math.max(0, Math.floor(h.bbox.x0 / f) - 3), y: Math.max(0, Math.floor(h.bbox.y0 / f) - 3) };
        r.w = Math.min(im.w, Math.ceil(h.bbox.x1 / f) + 3) - r.x;
        r.h = Math.min(im.h, Math.ceil(h.bbox.y1 / f) + 3) - r.y;
        await idle();
        const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
        if (regions(im).some(q => q.on && cx >= q.x && cx <= q.x + q.w && cy >= q.y && cy <= q.y + q.h)) continue;
        sampleFromSelection(im, r);
        added++;
      }
      if (added) break;
    }
    await idle();
    setStatus('');
    if (added) toast('found it');
    else if (seen) toast('already hidden');
    else toast("couldn't find it", 2500);
  } catch (err) {
    setStatus('');
    toast(String(err.message || err), 3500);
  } finally {
    $('findBtn').disabled = false;
  }
}

let toastTimer;
function setStatus(text, kind = 'progress') {
  const el = $('status');
  el.textContent = text; el.dataset.kind = text ? kind : '';
  el.style.display = text ? 'block' : 'none';
}
function toast(text, ms = 2000) {
  clearTimeout(toastTimer);
  setStatus(text, 'toast');
  toastTimer = setTimeout(() => { if ($('status').dataset.kind === 'toast') setStatus(''); showProgress(); }, ms);
}

function setMode(m) {
  S.mode = m;
  for (const b of $('mode').children) { b.classList.toggle('on', b.dataset.mode === m); b.setAttribute('aria-pressed', String(b.dataset.mode === m)); }
  renderBanner();
  drawOverlay();
}
$('mode').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.mode); });

function setZoom(z) {
  S.zoom = z === 'fit' ? 'fit' : Math.max(0.1, Math.min(8, z));
  renderStage();
}
$('zoomIn').onclick = () => setZoom(zoomFactor() * 1.25);
$('zoomOut').onclick = () => setZoom(zoomFactor() / 1.25);
$('zoomFit').onclick = () => setZoom('fit');
$('stage').addEventListener('wheel', e => {
  if (!e.ctrlKey || !S.cur) return;
  e.preventDefault();
  setZoom(zoomFactor() * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
}, { passive: false });
new ResizeObserver(() => { if (S.zoom === 'fit') renderStage(); else drawOverlay(); }).observe($('stage'));

for (const id of ['style', 'color', 'pad', 'outlines', 'room', 'plainNames']) $(id).addEventListener('input', () => { renderStage(); saveLook(); });
$('style').addEventListener('input', () => { $('color').style.display = $('style').value === 'solid' ? '' : 'none'; });
$('scales').addEventListener('change', () => { saveLook(); rematchAll(); });
$('remember').addEventListener('change', () => {
  saveLook();
  if ($('remember').checked) { saveData(); toast('saved on this device'); }
  else { storeSet(STORE.data, null); storeSet(STORE.legacy, null); }
});

$('undo').onclick = undo;
$('bannerClose').onclick = () => { S.hintsOff = true; storeSet(STORE.hints, true); renderBanner(); };
$('save').onclick = downloadCurrent;
$('saveAll').onclick = downloadAll;
$('stitchBtn').onclick = stitch;
$('copy').onclick = copyCurrent;
$('uncrop').onclick = () => { if (S.cur?.crop) setCrop(S.cur, null); };
$('addPerson').onclick = addPerson;
$('findBtn').onclick = findByName;
$('timeBtn').onclick = hideTimes;
$('findName').addEventListener('keydown', e => { if (e.key === 'Enter') findByName(); });
$('addBtn').onclick = $('pickBtn').onclick = () => $('file').click();
$('file').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });

window.addEventListener('paste', e => {
  if (e.target.closest?.('input[type=text]')) return;
  const files = [...e.clipboardData.items].filter(i => i.type.startsWith('image/')).map(i => i.getAsFile());
  if (files.length) { e.preventDefault(); addFiles(files); }
});

let dragDepth = 0;
window.addEventListener('dragenter', e => { if (e.dataTransfer?.types.includes('Files')) { dragDepth++; document.body.classList.add('dragging'); } });
window.addEventListener('dragleave', e => { if (!e.dataTransfer?.types.includes('Files')) return; if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

const typing = e => e.target.closest?.('input:not([type=checkbox]):not([type=radio]), textarea, select');
const onControl = e => e.target.closest?.('button, input, select, a, [role=button]');
window.addEventListener('keydown', e => {
  if (typing(e)) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ' && S.cur && !onControl(e)) { e.preventDefault(); if (!S.peek) { S.peek = true; renderStage(); } return; }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !e.target.closest?.('input, select')) {
    const i = S.images.indexOf(S.cur), j = i + (e.key === 'ArrowRight' ? 1 : -1);
    if (S.images[j]) { e.preventDefault(); select(S.images[j]); }
    return;
  }
  const k = e.key.toLowerCase();
  if (k === 'm') setMode('match');
  else if (k === 'b') setMode('box');
  else if (k === 'c') setMode('crop');
  else if (k === 'n') step(e.shiftKey ? -1 : 1);
  else if (k === 'x') toggleFocused();
  else if (e.key === 'Escape') {
    if (S.drag) { S.drag = null; drawOverlay(); }
    else if (S.focus >= 0) { S.focus = -1; drawOverlay(); }
  }
});
window.addEventListener('keyup', e => { if (e.key === ' ' && S.peek) { e.preventDefault(); S.peek = false; renderStage(); } });
window.addEventListener('blur', () => { if (S.peek) { S.peek = false; renderStage(); } });

async function receiveShared() {
  if (!new URLSearchParams(location.search).has('shared') || !('caches' in window)) return;
  history.replaceState(null, '', location.pathname);
  try {
    const cache = await caches.open('share-inbox');
    const files = [];
    for (const req of await cache.keys()) {
      const res = await cache.match(req);
      const blob = await res.blob();
      files.push(new File([blob], decodeURIComponent(res.headers.get('x-name') || 'shared.png'), { type: blob.type || 'image/png' }));
      await cache.delete(req);
    }
    if (files.length) await addFiles(files);
  } catch {}
}

(async () => {
  const l = storeGet(STORE.look);
  if (l) {
    if (['erase', 'solid', 'pixel', 'blur'].includes(l.style)) $('style').value = l.style;
    if (/^#[0-9a-f]{6}$/i.test(l.color)) $('color').value = l.color;
    if (Number.isFinite(l.pad)) $('pad').value = l.pad;
    $('outlines').checked = l.outlines !== false;
    $('remember').checked = !!l.remember;
    $('scales').checked = !!l.scales;
    if ('room' in l) $('room').checked = !!l.room;
    if ('plainNames' in l) $('plainNames').checked = !!l.plainNames;
  }
  $('color').style.display = $('style').value === 'solid' ? '' : 'none';
  if ($('remember').checked) await restoreData();
  ensurePeople();
  renderAll();
  await receiveShared();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
})();
</script>
</body>
